[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-skills"
version = "0.1.0"
description = "Cross-agent workflow skills for Codex, OpenCode, and Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aiwf = "aiwf.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.11.0,<2.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aiwf*"]
